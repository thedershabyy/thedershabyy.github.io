<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In - Rafeeq</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">
            <a href="index.html"><img src="Rafeeq_complete_logo.jpeg" alt="Rafeeq Logo" width="100" height="250"></a>
        </div>
        <div class="nav-buttons">
            <a href="register.html" class="btn-solid">Sign Up</a>
        </div>
    </nav>

    <div class="auth-container">
        <img src="Rafeeq_icon.jpeg" alt="Rafeeq Icon" style="width: 160px; margin-bottom: 1rem;">
        <h2>Welcome Back</h2>
        <form id="loginForm">
            <div class="role-toggle">
                <label><input type="radio" name="loginRole" value="owner" checked> Owner</label>
                <label><input type="radio" name="loginRole" value="sitter"> Sitter</label>
            </div>
            <input type="email" placeholder="Email Address" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="auth-btn">Sign In</button>
        </form>
    </div>

    <script>
        // Simulates backend routing based on user type
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            const role = document.querySelector('input[name="loginRole"]:checked').value;
            
            if (role === 'owner') {
                window.location.href = 'owner.html';
            } else if (role === 'sitter') {
                window.location.href = 'sitter.html';
            }
        });
    </script>
</body>
</html>
