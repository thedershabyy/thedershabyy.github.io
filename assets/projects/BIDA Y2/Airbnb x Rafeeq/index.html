<script>
const app=document.getElementById('app');
const KEY='rafeeq-demo-users-v1', SESSION='rafeeq-demo-session-v1', REQS='rafeeq-demo-requests-v1';
const photo=(id,w=800)=>`https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=85`;
const sampleSitters=[
 {id:'s1',name:'Nour Hassan',city:'Cairo',area:'Maadi',price:450,rating:'4.98',reviews:28,pets:'Dogs & cats',bio:'A calm, pet-friendly home with a sunny balcony and lots of play breaks.',img:'photo-1548199973-03cce0bbc87b'},
 {id:'s2',name:'Omar Adel',city:'Giza',area:'Sheikh Zayed',price:550,rating:'4.96',reviews:19,pets:'Dogs',bio:'Experienced dog dad with a secure garden and flexible routines.',img:'photo-1552053831-71594a27632d'},
 {id:'s3',name:'Mariam Samir',city:'Cairo',area:'New Cairo',price:400,rating:'4.93',reviews:16,pets:'Cats & small pets',bio:'Quiet apartment, no other pets at home, and regular photo updates.',img:'photo-1514888286974-6c03e2ca1dba'},
 {id:'s4',name:'Yasmin Khaled',city:'Alexandria',area:'Smouha',price:500,rating:'4.99',reviews:34,pets:'Dogs & cats',bio:'Lots of love, a cozy home, and nearby green space for little walks.',img:'photo-1543466835-00a7907e9de1'}
];
function users(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}}
function session(){try{return JSON.parse(localStorage.getItem(SESSION))}catch{return null}}
function reqs(){try{return JSON.parse(localStorage.getItem(REQS))||[]}catch{return[]}}
function saveReqs(v){localStorage.setItem(REQS,JSON.stringify(v))}
function go(path){location.hash=path}
function brand(){return `<a class="brand" href="#"><img class="brand-icon" src="Rafeeq_icon.jpeg" alt="Rafeeq"><span>rafeeq<small>Airbnb experience</small></span></a>`}
function landing(){app.innerHTML=`<header class="wrap topbar">${brand()}<nav class="nav" id="nav"><a href="#why">Our promise</a><a href="#how">How it works</a><a href="#hosts">For sitters</a><div class="nav-actions"><a class="btn light small" href="#signin">Sign in</a><a class="btn small" href="#signup">Join Rafeeq</a></div></nav><button class="mobile-menu" id="menu" aria-label="Open menu">☰</button></header>
<main><section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">Pet care, with a little more heart</div><h1>Good care<br>feels like <em>home.</em></h1><p class="hero-copy">Meet caring local sitters who welcome your pet into a safe, familiar home—so you can travel with a lighter heart.</p><div class="hero-buttons"><a class="btn" href="#signup">Find a sitter <span>→</span></a><a class="btn light" href="#signup" data-role="sitter">Become a sitter</a></div><div class="proof"><div class="avatars"><span>🐶</span><span>🐱</span><span>🐾</span></div><span>Made for the ones who feel like family</span></div><div class="trustline"><span>Thoughtful matching</span><span>Home-like stays</span><span>Peace of mind</span></div></div><div class="hero-art"><img src="Rafeeq_complete_logo.jpeg" alt="Rafeeq logo with a home and pet symbol"/><div class="float-card one"><div class="float-icon">♡</div><div><strong>Care, their way</strong><small>Routine made personal</small></div></div><div class="float-card two"><div class="float-icon">✦</div><div><strong>Local, loving sitters</strong><small>Across Egypt's big cities</small></div></div></div></div></section>
<div class="wrap"><form class="searchbar" id="quickSearch"><div class="searchfield"><label for="qcity">Where</label><select id="qcity"><option value="">Choose a city</option><option>Cairo</option><option>Giza</option><option>Alexandria</option></select></div><div class="searchfield"><label for="qpet">Your pet</label><select id="qpet"><option>Dog</option><option>Cat</option><option>Small pet</option></select></div><div class="searchfield"><label for="qdate">When</label><input id="qdate" type="date"></div><button class="btn" type="submit">Explore sitters →</button><div id="qmsg" class="search-message" aria-live="polite"></div></form></div>
<section class="content" id="why"><div class="wrap"><div class="section-title"><div class="kicker">The Rafeeq promise</div><h2>Comfort for them.<br>Confidence for you.</h2><p>Rafeeq brings Airbnb’s spirit of belonging to pet care, with thoughtful stays that put your companion’s wellbeing first.</p></div><div class="cards"><article class="card"><div class="icon">⌂</div><h3>A home, not a kennel</h3><p>Welcoming spaces and familiar rhythms help pets settle in and feel at ease.</p></article><article class="card"><div class="icon">♡</div><h3>Care with intention</h3><p>Tell your sitter about routines, favorite toys, and the little things that matter.</p></article><article class="card"><div class="icon">✦</div><h3>Stay connected</h3><p>Clear communication and thoughtful updates help you feel close, wherever you are.</p></article></div></div></section>
<section class="content"><div class="wrap split"><div class="split-image"><img src="${photo('photo-1548199973-03cce0bbc87b',1000)}" alt="Two dogs enjoying a relaxed moment together"><div class="image-tag">Care that feels like a familiar friend.</div></div><div class="split-copy"><div class="kicker">Belong anywhere, together</div><h2>Every member of your family deserves to feel at home.</h2><p>Rafeeq connects pet parents with caring sitters nearby. Together, they create a stay built around a pet’s needs, comfort, and sense of safety.</p><div class="point"><i>✓</i> Caring people and clear profiles</div><div class="point"><i>✓</i> Stays in Cairo, Giza, and Alexandria</div><div class="point"><i>✓</i> A more personal way to arrange pet care</div></div></div></section>
<section class="content how" id="how"><div class="wrap"><div class="section-title"><div class="kicker">Easy as one, two, three</div><h2>A better stay starts with a good match.</h2><p>Simple steps for pet parents and caring sitters to meet with confidence.</p></div><div class="steps"><article class="step"><b>01</b><h3>Create your profile</h3><p>Tell us whether you’re a pet parent or sitter, and share the details that help us make a thoughtful match.</p></article><article class="step"><b>02</b><h3>Find your Rafeeq</h3><p>Explore local sitter profiles, compare care styles, and send a stay request.</p></article><article class="step"><b>03</b><h3>Feel at ease</h3><p>Connect, share your pet’s routine, and enjoy a little more peace of mind.</p></article></div><div class="audience"><span class="pill">Cairo</span><span class="pill">Giza</span><span class="pill">Alexandria</span><span class="pill">For pet people who care deeply</span></div></div></section>
<section class="content" id="hosts"><div class="wrap"><div class="cta-panel"><div><div class="kicker" style="color:#dceba5">For the caring ones</div><h2>Make a little room for a new friend.</h2><p>Share your time and welcoming space with pet parents looking for thoughtful care. Your home could be their pet’s favorite place.</p></div><a class="btn lime" href="#signup" data-role="sitter">Join as a sitter →</a></div></div></section></main>
<footer><div class="wrap"><div class="footer-grid"><div>${brand()}<p>A proposed Airbnb experience bringing home-like pet care to Egypt’s biggest cities.</p></div><div><h4>Discover</h4><a href="#why">Our promise</a><a href="#how">How it works</a><a href="#signup">Find a sitter</a></div><div><h4>Community</h4><a href="#signup" data-role="sitter">Become a sitter</a><a href="#why">Care & wellbeing</a><a href="#signup">Join Rafeeq</a></div><div><h4>Project 3</h4><a href="#">Airbnb × Rafeeq</a><a href="#">University of Europe for Applied Sciences</a></div></div><div class="credits"><strong>Prepared by:</strong> Mohamed Fathy EL DERSHABY &amp; Youssef Adham EL MAGHRABY<br><strong>Instructor:</strong> Dr. Marwa NABIL · UFE</div><div class="copyright"><span>© 2026 Rafeeq · A university project concept</span><span>Made with care for pets and their people.</span></div></div></footer>`;
document.getElementById('menu').onclick=()=>document.getElementById('nav').classList.toggle('open');document.getElementById('quickSearch').onsubmit=e=>{e.preventDefault();const c=document.getElementById('qcity').value;if(!c){document.getElementById('qmsg').textContent='Choose your city to explore nearby sitters.';return}sessionStorage.setItem('rafeeq-city',c);go('#signin')};document.querySelectorAll('[data-role="sitter"]').forEach(x=>x.onclick=()=>sessionStorage.setItem('rafeeq-role','sitter'));document.getElementById('qdate').min=new Date().toISOString().slice(0,10)}
function auth(kind){let role=sessionStorage.getItem('rafeeq-role')||'owner';const notice=kind==='signin'?sessionStorage.getItem('rafeeq-notice'):'';if(notice)sessionStorage.removeItem('rafeeq-notice');app.innerHTML=`<main class="auth-page"><aside class="auth-story">${brand()}<div><div class="eyebrow">Care that feels like home</div><h1>Small paws.<br>Big peace of mind.</h1><p>A community built on trust, kindness, and the belief that every pet deserves to feel safe and loved.</p></div><div class="story-note">Airbnb × Rafeeq · Project 3 · UFE</div></aside><section class="auth-side"><div class="auth-card"><a href="#" class="text-btn">← Back to home</a><h2 id="authTitle" style="margin-top:20px">${kind==='signup'?'Join the Rafeeq community':'Welcome back'}</h2><p id="authDesc">${kind==='signup'?'First, tell us how you’ll be part of Rafeeq.':'Sign in to continue to your Rafeeq space.'}</p>${notice?`<div class="notice">${escapeHtml(notice)}</div>`:''}<div class="tabs"><button data-tab="owner" class="${role==='owner'?'active':''}">Pet owner</button><button data-tab="sitter" class="${role==='sitter'?'active':''}">Pet sitter</button></div><form class="form-grid" id="authForm"><div id="nameField" class="${kind==='signin'?'hidden':''}"><label>Your name<input name="name" autocomplete="name" placeholder="e.g. Salma Hassan" ${kind==='signup'?'required':''}></label></div><label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input name="password" type="password" minlength="6" autocomplete="${kind==='signup'?'new-password':'current-password'}" required placeholder="At least 6 characters"></label><div id="extraFields" class="${kind==='signin'?'hidden':''}"></div><div class="form-error" id="error" aria-live="polite"></div><button class="btn" type="submit">${kind==='signup'?'Create my account':'Sign in'} →</button></form><p class="form-foot">${kind==='signup'?'Already have an account?':'New to Rafeeq?'} <button class="text-btn" id="switchAuth">${kind==='signup'?'Sign in':'Create an account'}</button></p><div class="story-note" style="text-align:center;margin-top:20px">By continuing, you agree to treat every Rafeeq with kindness.</div></div></section></main>`;
let currentRole=role;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{currentRole=b.dataset.tab;sessionStorage.setItem('rafeeq-role',currentRole);document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));extra()});function extra(){const el=document.getElementById('extraFields');if(kind==='signin'){el.classList.add('hidden');return}el.classList.remove('hidden');el.innerHTML=currentRole==='owner'?`<div class="form-row"><label>City<select name="city" required><option value="">Choose city</option><option>Cairo</option><option>Giza</option><option>Alexandria</option></select></label><label>Pet type<select name="pet" required><option value="">Choose pet</option><option>Dog</option><option>Cat</option><option>Small pet</option><option>Other</option></select></label></div><label>Pet’s name<input name="petName" placeholder="Your companion’s name" required></label>`:`<div class="form-row"><label>City<select name="city" required><option value="">Choose city</option><option>Cairo</option><option>Giza</option><option>Alexandria</option></select></label><label>Rate per night (EGP)<input name="price" type="number" min="100" placeholder="450" required></label></div><label>About your care<textarea name="bio" placeholder="What makes your home a lovely place to stay?" required></textarea></label>`};extra();document.getElementById('switchAuth').onclick=()=>go(kind==='signup'?'#signin':'#signup');document.getElementById('authForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget),email=String(fd.get('email')).trim().toLowerCase(),password=String(fd.get('password')),list=users();if(kind==='signup'){if(list.some(u=>u.email===email)){document.getElementById('error').textContent='An account with this email already exists. Please sign in.';return}const u={id:crypto.randomUUID(),name:fd.get('name'),email,password,role:currentRole,city:fd.get('city'),pet:fd.get('pet'),petName:fd.get('petName'),price:Number(fd.get('price')),bio:fd.get('bio')};list.push(u);localStorage.setItem(KEY,JSON.stringify(list));go('#signin');sessionStorage.setItem('rafeeq-notice','Account created. Sign in with your new details.')}else{const u=list.find(x=>x.email===email&&x.password===password);if(!u){document.getElementById('error').textContent='We couldn’t match those details. Check your email and password, or create an account.';return}localStorage.setItem(SESSION,JSON.stringify({id:u.id}));go(u.role==='owner'?'#owner':'#sitter')}}}
function currentUser(){const s=session();return s&&users().find(u=>u.id===s.id)}function appHeader(u){return `<header class="app-header">${brand()}<div class="profile-bar"><div class="profile-avatar">${(u.name||'R')[0].toUpperCase()}</div><div style="font-size:12px;font-weight:700">${escapeHtml(u.name)}<div style="color:var(--muted);font-size:10px;font-weight:500;text-transform:capitalize">${u.role} account</div></div><button class="signout" id="signout">Sign out</button></div></header>`}function escapeHtml(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function bindSignout(){document.getElementById('signout').onclick=()=>{localStorage.removeItem(SESSION);go('#')}}
function ownerDash(u){app.innerHTML=`<div class="app-shell">${appHeader(u)}<main class="app-main"><div class="app-title"><div><h1>Find your pet’s Rafeeq</h1><p>Thoughtful care is closer than you think, ${escapeHtml(u.name.split(' ')[0])}.</p></div></div><div class="dash-grid"><section class="panel"><h2>Explore caring sitters</h2><div class="filter-row"><select class="control" id="cityFilter"><option value="">All cities</option>${['Cairo','Giza','Alexandria'].map(c=>`<option ${u.city===c?'selected':''}>${c}</option>`).join('')}</select><select class="control" id="petFilter"><option value="">Any pet</option><option>Dog</option><option>Cat</option><option>Small pet</option></select><select class="control" id="sortFilter"><option value="recommended">Recommended</option><option value="price">Price: low to high</option><option value="rating">Top rated</option></select><button class="btn small" id="filterBtn">Apply</button></div><div class="sitter-list" id="sitterList"></div></section><aside class="aside-stack"><section class="panel safe-box"><h2>Care starts with a conversation</h2><p>Before confirming a stay, message your sitter to share routines, meet in person, and make sure it feels right for everyone.</p><div class="point"><i>✓</i> Share important care details</div><div class="point"><i>✓</i> Arrange a meet and greet</div></section><section class="panel"><h2>Your stay requests</h2><div class="request-list" id="ownerRequests"></div></section></aside></div></main></div>`;bindSignout();const render=()=>{const city=document.getElementById('cityFilter').value,pet=document.getElementById('petFilter').value,sort=document.getElementById('sortFilter').value;let list=[...sampleSitters,...users().filter(x=>x.role==='sitter').map(x=>({...x,id:x.id,area:x.city,price:x.price||400,rating:'New',reviews:0,pets:x.bio?'Personalized care':'Pets welcome',img:'photo-1530281700549-e82e7bf110d6'}))].filter(s=>(!city||s.city===city)&&(!pet||s.pets.toLowerCase().includes(pet.toLowerCase())||s.pets.includes('&')));if(sort==='price')list.sort((a,b)=>a.price-b.price);if(sort==='rating')list.sort((a,b)=>(Number(b.rating)||0)-(Number(a.rating)||0));document.getElementById('sitterList').innerHTML=list.length?list.map(s=>`<article class="sitter-card"><img src="${photo(s.img,300)}" alt="${escapeHtml(s.name)}"><div><h3>${escapeHtml(s.name)} <span style="color:#d29b42;font-size:12px">★ ${s.rating}</span></h3><div class="meta">${escapeHtml(s.area||s.city)} · ${s.reviews} reviews · ${escapeHtml(s.pets||'Pet care')}</div><p>${escapeHtml(s.bio)}</p><span class="badge">Thoughtful care</span></div><div class="price"><b>EGP ${s.price}</b><br>per night<button class="btn small request-btn" data-sitter="${s.id}" style="margin-top:10px;padding:9px 12px">Request</button></div></article>`).join(''):'<div class="empty">No sitters match these filters yet. Try another city or pet type.</div>';document.querySelectorAll('.request-btn').forEach(b=>b.onclick=()=>{const existing=reqs();existing.push({id:crypto.randomUUID(),ownerId:u.id,owner:u.name,sitterId:b.dataset.sitter,sitter:(list.find(s=>s.id===b.dataset.sitter)||{}).name||'Sitter',pet:u.petName||'Your pet',city:u.city,status:'Pending'});saveReqs(existing);renderRequests(u);b.textContent='Sent ✓';b.disabled=true})};function renderRequests(owner){const own=reqs().filter(r=>r.ownerId===owner.id);document.getElementById('ownerRequests').innerHTML=own.length?own.map(r=>`<div class="request-item"><strong>${escapeHtml(r.sitter)}</strong><p>${escapeHtml(r.pet)} · ${escapeHtml(r.city||'Egypt')}<br>Status: <b>${escapeHtml(r.status)}</b></p></div>`).join(''):'<div class="empty">Your requests will appear here.</div>'}document.getElementById('filterBtn').onclick=render;render();renderRequests(u)}
function sitterDash(u){app.innerHTML=`<div class="app-shell">${appHeader(u)}<main class="app-main"><div class="app-title"><div><h1>Your caring space</h1><p>Welcome, ${escapeHtml(u.name.split(' ')[0])}. Your next great match may be just around the corner.</p></div><button class="btn small" id="editProfile">Edit profile</button></div><div class="dash-grid"><section class="panel"><h2>Stay requests <span class="badge" id="pendingCount"></span></h2><div class="request-list" id="sitterRequests"></div></section><aside class="aside-stack"><section class="panel safe-box"><h2>Your sitter profile</h2><p><strong>${escapeHtml(u.name)}</strong><br>${escapeHtml(u.city||'City not set')} · EGP ${u.price||'—'} / night</p><p>${escapeHtml(u.bio||'Add a few words about your care style.')}</p><span class="badge">Profile visible to pet owners</span></section><section class="panel"><h2>Good care begins here</h2><p class="panel-copy">Keep your availability up to date, talk through a pet’s needs before accepting, and make every little guest feel at home.</p></section></aside></div></main></div>`;bindSignout();const list=document.getElementById('sitterRequests');function render(){const pending=reqs().filter(r=>r.sitterId===u.id&&r.status==='Pending');document.getElementById('pendingCount').textContent=`${pending.length} new`;list.innerHTML=pending.length?pending.map(r=>`<div class="request-item"><strong>Stay request from ${escapeHtml(r.owner)}</strong><p>${escapeHtml(r.pet)} · ${escapeHtml(r.city||'Egypt')}<br>Request status: awaiting your response</p><div class="request-actions"><button class="accept" data-id="${r.id}" data-status="Accepted">Accept request</button><button class="reject" data-id="${r.id}" data-status="Declined">Decline</button></div></div>`).join(''):'<div class="empty">No new requests yet. When an owner reaches out, you’ll see it here.</div>';document.querySelectorAll('.request-actions button').forEach(b=>b.onclick=()=>{const all=reqs().map(r=>r.id===b.dataset.id?{...r,status:b.dataset.status}:r);saveReqs(all);render()})}render();document.getElementById('editProfile').onclick=()=>{const name=prompt('Your display name',u.name);if(!name)return;const next=users().map(x=>x.id===u.id?{...x,name}:x);localStorage.setItem(KEY,JSON.stringify(next));sitterDash(next.find(x=>x.id===u.id))}}
function route(){const p=location.hash.replace('#','').split('?')[0];if(p==='signup')return auth('signup');if(p==='signin')return auth('signin');if(p==='owner'||p==='sitter'){const u=currentUser();if(!u){go('#signin');return}if((p==='owner')!==(u.role==='owner')){go(u.role==='owner'?'#owner':'#sitter');return}return p==='owner'?ownerDash(u):sitterDash(u)}landing();const note=sessionStorage.getItem('rafeeq-notice');if(note){sessionStorage.removeItem('rafeeq-notice');const b=document.createElement('div');b.className='notice';b.textContent=note;document.querySelector('.hero .wrap').prepend(b)}}window.addEventListener('hashchange',route);route();
</script>
</body>
